services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  api:
    build: .
    environment:
      - QDRANT_URL=http://qdrant:6333
      - ES_HOST=elasticsearch
      - ES_PORT=9200
    env_file:
      - path: .env # OPENAI_API_KEY, ...
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./model_weights:/app/model_weights
      - ./results:/app/results
      - ./temp_cache:/app/temp_cache
    depends_on:
      - qdrant
      - elasticsearch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  web:
    build: ./online/frontend
    environment:
      - API_URL=http://api:8000
      - DATA_ROOT=/data
      # - DRES_URL=https://eventretrieval.oj.io.vn  # đổi khi BTC công bố instance 2026
    ports:
      - "3000:3000"
    volumes:
      - ./results:/data/results:ro
    depends_on:
      - api

volumes:
  es_data:
